<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kafka — как путешествует сообщение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f4efe6; --dim: #c9bfae; --glass: rgba(22, 18, 30, .62); --line: rgba(255,255,255,.14); --hot: #ffb347; --mint: #7cf2c4; --vio: #b59cff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1424; color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; touch-action: none; }
  .label { font: 600 12px Inter, sans-serif; color: #fff; padding: 3px 8px; border-radius: 8px; background: rgba(15,12,22,.72); border: 1px solid var(--line); white-space: nowrap; pointer-events: none; transition: opacity .4s; }
  .label.big { font: 700 13px Unbounded, sans-serif; letter-spacing: .3px; }
  .label.hot { border-color: var(--hot); color: var(--hot); }
  .label.mint { border-color: var(--mint); color: var(--mint); }
  .label.vio { border-color: var(--vio); color: var(--vio); }
  .label.red { border-color: #ff6b6b; color: #ff8a8a; }
  body.nolabels .label { opacity: 0; }

  .ui { position: fixed; left: 0; right: 0; pointer-events: none; padding: 0 max(14px, env(safe-area-inset-left)); }
  .top { top: max(12px, env(safe-area-inset-top)); }
  .brand { font: 700 13px Unbounded, sans-serif; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
  .brand b { color: var(--hot); font-size: 20px; letter-spacing: .5px; text-transform: none; display: inline-block; margin-left: 6px; }
  .card { pointer-events: auto; margin-top: 10px; max-width: 560px; padding: 14px 16px; border-radius: 18px; background: var(--glass); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .card .meta { display: flex; justify-content: space-between; gap: 10px; font: 600 12px "JetBrains Mono", monospace; color: var(--dim); }
  .card .meta span:last-child { text-transform: uppercase; letter-spacing: 1px; }
  .card h2 { margin: 4px 0 4px; font: 700 19px/1.25 Unbounded, sans-serif; }
  .card p { margin: 0; color: #e4dccd; font-size: 14.5px; }
  .card p b { color: #fff; }
  .card p code { font: 600 12.5px "JetBrains Mono", monospace; color: var(--hot); background: rgba(255,179,71,.12); padding: 1px 6px; border-radius: 6px; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .acts:empty { display: none; }
  .act { pointer-events: auto; border: 1px solid var(--line); background: rgba(255,255,255,.08); color: #fff; border-radius: 999px; padding: 7px 12px; font: 600 13px Inter, sans-serif; cursor: pointer; }
  .act.k { font-family: "JetBrains Mono", monospace; }
  .act:active { transform: scale(.96); }
  .act.primary { background: var(--hot); color: #24160a; border-color: transparent; }
  .hud { position: fixed; right: max(14px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); display: grid; gap: 6px; pointer-events: none; }
  .hud div { font: 600 12px "JetBrains Mono", monospace; padding: 6px 10px; border-radius: 10px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); }
  .hud div.hi { color: var(--hot); border-color: var(--hot); }

  .bottom { bottom: max(12px, env(safe-area-inset-bottom)); }
  .bar { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: 760px; margin: 0 auto; padding: 10px 12px; border-radius: 18px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); }
  .btn { flex: none; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.08); color: #fff; display: grid; place-items: center; cursor: pointer; font-size: 16px; }
  .btn.play { background: var(--hot); color: #24160a; border-color: transparent; }
  .btn.on { background: rgba(124,242,196,.2); border-color: var(--mint); color: var(--mint); }
  .dots { flex: 1; display: flex; gap: 4px; align-items: center; min-width: 0; }
  .dot { flex: 1; height: 8px; border-radius: 5px; background: rgba(255,255,255,.14); position: relative; overflow: hidden; cursor: pointer; }
  .dot i { position: absolute; inset: 0; width: 0; background: var(--hot); }
  .dot.done i { width: 100%; background: rgba(255,179,71,.55); }
  .tools { display: flex; gap: 6px; }
  @media (max-width: 600px) {
    .card { padding: 12px 13px; }
    .card h2 { font-size: 16px; }
    .card p { font-size: 13.5px; }
    .bar { gap: 6px; padding: 8px; }
    .btn { width: 38px; height: 38px; }
    .tools .btn.opt { display: none; }
    .hud { top: auto; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 66px); }
  }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 700 14px Unbounded, sans-serif; color: var(--dim); background: #1a1424; transition: opacity .6s; z-index: 5; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scene"></div>
<div id="loading">собираем склад…</div>

<div class="ui top">
  <div class="brand">как работает <b>Kafka</b></div>
  <div class="card">
    <div class="meta"><span id="num">00 / 11</span><span id="actname"></span></div>
    <h2 id="title"></h2>
    <p id="text"></p>
    <div class="acts" id="acts"></div>
  </div>
</div>
<div class="hud" id="hud"></div>
<div class="ui bottom">
  <div class="bar">
    <button class="btn" id="prev" title="Назад">‹</button>
    <button class="btn play" id="play" title="Пауза">❚❚</button>
    <button class="btn" id="next" title="Дальше">›</button>
    <div class="dots" id="dots"></div>
    <div class="tools">
      <button class="btn opt" id="labels" title="Подписи">Aa</button>
      <button class="btn" id="free" title="Свободная камера">⟲</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

// ===================== сцена =====================
const mobile = innerWidth < 700;
const host = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.6 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
host.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer();
labelR.setSize(innerWidth, innerHeight);
Object.assign(labelR.domElement.style, { position: "absolute", top: 0, left: 0, pointerEvents: "none" });
host.appendChild(labelR.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a1f38);
scene.fog = new THREE.Fog(0x2a1f38, 45, 95);
const camera = new THREE.PerspectiveCamera(mobile ? 52 : 40, innerWidth / innerHeight, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enabled = false;
controls.maxPolarAngle = Math.PI * 0.47;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.6, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// свет: тёплый закат + холодное небо
scene.add(new THREE.HemisphereLight(0xffe2c2, 0x3a2f52, 1.25));
const sun = new THREE.DirectionalLight(0xffc68a, 2.2);
sun.position.set(-18, 26, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(mobile ? 1024 : 2048, mobile ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 18, bottom: -18, near: 1, far: 70 });
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.05;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x8fb4ff, 0.6);
rim.position.set(20, 10, -20);
scene.add(rim);

const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0.05, ...o });
function mesh(geo, mat, x = 0, y = 0, z = 0, cast = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = cast;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}
function label(text, cls, x, y, z, parent = scene) {
  const el = document.createElement("div");
  el.className = "label " + (cls || "");
  el.textContent = text;
  const o = new CSS2DObject(el);
  o.position.set(x, y, z);
  parent.add(o);
  return o;
}

// остров-диорама со скруглёнными краями
{
  const shape = new THREE.Shape();
  const W = 44, D = 26, r = 3;
  shape.moveTo(-W / 2 + r, -D / 2);
  shape.lineTo(W / 2 - r, -D / 2); shape.quadraticCurveTo(W / 2, -D / 2, W / 2, -D / 2 + r);
  shape.lineTo(W / 2, D / 2 - r); shape.quadraticCurveTo(W / 2, D / 2, W / 2 - r, D / 2);
  shape.lineTo(-W / 2 + r, D / 2); shape.quadraticCurveTo(-W / 2, D / 2, -W / 2, D / 2 - r);
  shape.lineTo(-W / 2, -D / 2 + r); shape.quadraticCurveTo(-W / 2, -D / 2, -W / 2 + r, -D / 2);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 2.2, bevelEnabled: true, bevelSize: 0.4, bevelThickness: 0.4, bevelSegments: 3 });
  geo.rotateX(-Math.PI / 2);
  const base = mesh(geo, M(0x3b3048), 1, -2.85, 0, false);
  const top = mesh(new THREE.BoxGeometry(43.2, 0.3, 25.2), M(0x75668a), 1, -0.15, 0, false);
  top.receiveShadow = true;
  // дорожки на земле
  mesh(new THREE.BoxGeometry(5.5, 0.05, 1.4), M(0x6e5f7c), -10.5, 0.03, 0, false);
}

// ---------- продюсер: фабрика ----------
const factory = new THREE.Group();
scene.add(factory);
factory.position.set(-16, 0, 0);
{
  const wall = M(0xe8a46a), roof = M(0x9b4f3a), dark = M(0x2b2233);
  const body = new THREE.Mesh(new THREE.BoxGeometry(6, 3.4, 6.5), wall); body.position.y = 1.7; body.castShadow = body.receiveShadow = true; factory.add(body);
  // пилообразная крыша: треугольные призмы вдоль здания
  const tri = new THREE.Shape(); tri.moveTo(0, 0); tri.lineTo(2, 0); tri.lineTo(2, 1.1); tri.lineTo(0, 0);
  for (let i = 0; i < 3; i++) {
    const g = new THREE.ExtrudeGeometry(tri, { depth: 6.5, bevelEnabled: false });
    const t = new THREE.Mesh(g, roof); t.position.set(-3 + i * 2, 3.4, -3.25); t.castShadow = true; factory.add(t);
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 1.05), M(0xffe7b8, { emissive: 0xffb45e, emissiveIntensity: 1.1, side: THREE.DoubleSide }));
    glass.position.set(-1 + i * 2 - 0.02, 3.95, 0); glass.rotation.y = Math.PI / 2; factory.add(glass);
  }
  const chim = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 3.5, 16), M(0x7a3f33)); chim.position.set(-2, 4.6, -2.2); chim.castShadow = true; factory.add(chim);
  const glow = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.25, 16), M(0xffd27a, { emissive: 0xffa53d, emissiveIntensity: 2 })); glow.position.set(-2, 6.3, -2.2); factory.add(glow);
  for (let i = 0; i < 4; i++) {  // светящиеся окна
    const w = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.7), M(0xffe2a8, { emissive: 0xffc06a, emissiveIntensity: 1.6 }));
    w.position.set(-2.1 + i * 1.4, 2.2, 3.26); factory.add(w);
  }
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.6, 1.6), dark); door.position.set(3.02, 0.8, 0); factory.add(door);
}
label("Продюсер · сервис заказов", "big hot", -16, 7.2, 0);

// дым из трубы
const smoke = [];
for (let i = 0; i < 9; i++) {
  const s = mesh(new THREE.SphereGeometry(0.5, 12, 10), M(0xd9cfe0, { transparent: true, opacity: 0.5, roughness: 1 }), -18, 6.5, -2.2, false);
  s.userData.t = i / 9;
  smoke.push(s);
}

// ---------- конвейер от фабрики к распределителю ----------
function belt(x1, z1, x2, z2, w = 1.3) {
  const len = Math.hypot(x2 - x1, z2 - z1), ang = Math.atan2(z2 - z1, x2 - x1);
  const g = new THREE.Group();
  const top = new THREE.Mesh(new THREE.BoxGeometry(len, 0.18, w), M(0x2e2836, { roughness: 0.9 })); top.position.y = 0.42; top.receiveShadow = true; g.add(top);
  const frame = M(0x8d8597, { metalness: 0.4, roughness: 0.5 });
  for (const s of [-1, 1]) { const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.14, 0.1), frame); rail.position.set(0, 0.52, s * (w / 2 + 0.03)); g.add(rail); }
  for (let i = 0; i <= Math.floor(len / 1.6); i++) { const leg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.42, w * 0.9), frame); leg.position.set(-len / 2 + i * 1.6, 0.2, 0); leg.castShadow = true; g.add(leg); }
  g.position.set((x1 + x2) / 2, 0, (z1 + z2) / 2);
  g.rotation.y = -ang;
  scene.add(g);
  return g;
}
belt(-12.9, 0, -9, 0);

// ---------- распределитель: hash(ключ) % 3 ----------
const router = new THREE.Group();
scene.add(router);
router.position.set(-8, 0, 0);
{
  const base = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.7, 0.9, 32), M(0x4a3f58)); base.position.y = 0.45; base.castShadow = base.receiveShadow = true; router.add(base);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.25, 0.12, 32), M(0xffb347, { emissive: 0xff8a1f, emissiveIntensity: 0.6, metalness: 0.3 })); disc.position.y = 0.96; router.add(disc);
  router.userData.disc = disc;
  for (let i = 0; i < 3; i++) { const arm = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.12, 0.18), M(0x2b2233)); arm.position.set(0.55, 0.1, 0); const pivot = new THREE.Group(); pivot.rotation.y = (i * Math.PI * 2) / 3; pivot.add(arm); disc.add(pivot); }
}
label("hash(ключ) % 3", "hot", -8, 2.4, 0);

// ---------- брокеры, партиции, реплики ----------
const LANE_Z = [-7, 0, 7];
const SLOT0 = -2.4, SLOT = 1.0, MAXS = 15;
const slotX = (o) => SLOT0 + o * SLOT;
const KEYS = ["user-1", "user-2", "user-3", "user-4"];
const KCOL = [0x4fb3ff, 0xffc94a, 0xff6fa8, 0x9f7bff];
const partOf = (k) => [0, 1, 2, 1][k];          // упрощённо: «хеш» фиксированный, чтобы пример был предсказуем
const repBroker = (p) => (p + 1) % 3;           // реплика P0 на брокере 2, P1 — на 3, P2 — на 1
const brokers = [];
for (let b = 0; b < 3; b++) {
  const z = LANE_Z[b];
  const g = { z, parts: [], light: null, floor: null, ribs: [] };
  g.floor = mesh(new THREE.BoxGeometry(18.6, 0.16, 5.6), M(0x7a6a86), 6.4, 0.08, z, false);
  const wallM = M(0xcfc3d8, { roughness: 0.6 });
  mesh(new THREE.BoxGeometry(18.6, 1.1, 0.18), wallM, 6.4, 0.6, z - 2.75);
  mesh(new THREE.BoxGeometry(0.18, 1.1, 5.6), wallM, 15.6, 0.6, z);
  // арки ангара (каркас без крыши — как у диорамы)
  for (let i = 0; i < 6; i++) {
    const arc = new THREE.Mesh(new THREE.TorusGeometry(2.8, 0.07, 6, 24, Math.PI), M(0x9d93a8, { metalness: 0.5, roughness: 0.4 }));
    arc.position.set(-2.6 + i * 3.6, 0.2, z); arc.rotation.y = Math.PI / 2; arc.castShadow = true; scene.add(arc); g.ribs.push(arc);
  }
  const lamp = new THREE.PointLight(0xffc27a, 14, 12, 1.8); lamp.position.set(6, 3.2, z); scene.add(lamp); g.light = lamp;
  g.label = label(`Брокер ${b + 1}`, "big", 6.4, 3.6, z - 2.9);
  brokers.push(g);
}
// ленты: главная (лидер) и полка реплики
const partitions = [0, 1, 2].map((p) => ({ p, msgs: [], leader: "home" }));
function locOf(p, which) {
  const b = which === "home" ? p : repBroker(p);
  return { b, z: which === "home" ? LANE_Z[b] : LANE_Z[b] - 1.45, rep: which !== "home" };
}
for (let p = 0; p < 3; p++) {
  const h = locOf(p, "home"); belt(-3.2, h.z, 14.6, h.z, 1.25);
  partitions[p].homeLabel = label(`P${p} · лидер`, "mint", -4.6, 1.5, h.z + 0.3);
  const r = locOf(p, "rep");
  const shelf = mesh(new THREE.BoxGeometry(17.8, 0.12, 0.95), M(0x5b4f69), 6.1, 0.35, r.z);
  shelf.material.transparent = true; shelf.material.opacity = 0.9;
  partitions[p].repLabel = label(`реплика P${p}`, "", 15.4, 0.9, r.z);
  partitions[p].shelf = shelf;
}
// подводящие ленты от распределителя
for (let p = 0; p < 3; p++) belt(-6.6, LANE_Z[p] * 0.18, -3.2, LANE_Z[p], 1.1);

// ---------- текстуры коробок: цвет ключа + офсет ----------
const texCache = new Map();
function topTex(k, n) {
  const id = k + ":" + n;
  if (texCache.has(id)) return texCache.get(id);
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const x = c.getContext("2d");
  x.fillStyle = "#" + KCOL[k].toString(16).padStart(6, "0"); x.fillRect(0, 0, 128, 128);
  x.fillStyle = "rgba(255,255,255,.9)"; x.fillRect(10, 10, 108, 108);
  x.fillStyle = "#1d1626"; x.font = "bold 64px JetBrains Mono, monospace"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(String(n), 64, 70);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; texCache.set(id, t);
  return t;
}
const boxGeo = new THREE.BoxGeometry(0.8, 0.62, 0.8);
function makeBox(k, n, ghost = false) {
  const side = M(KCOL[k], { emissive: KCOL[k], emissiveIntensity: ghost ? 0.35 : 0.22, transparent: ghost, opacity: ghost ? 0.45 : 1 });
  const top = M(0xffffff, { map: topTex(k, n), transparent: ghost, opacity: ghost ? 0.5 : 1 });
  const m = new THREE.Mesh(boxGeo, [side, side, top, side, side, side]);
  m.castShadow = !ghost;
  m.userData = { k, n, side, top };
  scene.add(m);
  return m;
}
function dimBox(m, on) {
  const { side, top } = m.userData;
  side.color.set(on ? 0x6d6478 : KCOL[m.userData.k]);
  side.emissiveIntensity = on ? 0 : 0.22;
  top.color.set(on ? 0x9b93a6 : 0xffffff);
}

// ---------- роботы-консьюмеры ----------
const groups = {
  billing: { name: "billing", color: 0x7cf2c4, cls: "mint", robots: [], off: [0, 0, 0], active: true, paused: false, side: 1 },
  analytics: { name: "analytics", color: 0xb59cff, cls: "vio", robots: [], off: [0, 0, 0], active: false, paused: false, side: -1 },
};
function makeRobot(g, i) {
  const r = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.33, 0.55, 6, 12), M(0xe9e3f2, { roughness: 0.4 }));
  body.position.y = 0.75; body.castShadow = true; r.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), M(0xe9e3f2, { roughness: 0.35 })); head.position.y = 1.45; head.castShadow = true; r.add(head);
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.12, 0.08), M(g.color, { emissive: g.color, emissiveIntensity: 2.2 }));
  visor.position.set(0, 1.47, 0.27); r.add(visor);
  const ant = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), M(g.color, { emissive: g.color, emissiveIntensity: 3 })); ant.position.y = 1.86; r.add(ant);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1, 6), new THREE.MeshBasicMaterial({ color: g.color, transparent: true, opacity: 0.9 }));
  beam.visible = false; scene.add(beam);
  r.position.set(18, 0, 10 + i * 1.3);
  scene.add(r);
  const name = (g.name === "billing" ? "c" : "a") + (i + 1);
  const lab = label(name, g.cls, 0, 2.3, 0, r);
  const robot = { g: r, beam, name, lab, part: null, cur: 0, beamT: 0, head };
  g.robots.push(robot);
  return robot;
}
function assign(g) {
  g.robots.forEach((r) => (r.parts = []));
  if (!g.robots.length) return;
  for (let p = 0; p < 3; p++) g.robots[p % g.robots.length].parts.push(p);
  g.robots.forEach((r) => { r.lab.element.textContent = r.parts.length ? `${r.name} · P${r.parts.join(", P")}` : `${r.name} · простаивает`; });
}

// ===================== сообщения =====================
const flying = [];
function send(k) {
  const p = partOf(k);
  const part = partitions[p];
  if (part.msgs.length >= MAXS) {   // демо: старые сообщения уходят по сроку хранения (retention)
    const old = part.msgs.shift();
    for (const b of [old.box, old.rep]) if (b) scene.remove(b);
    part.msgs.forEach((m, i) => (m.slot = i));
    layout();
  }
  const msg = { k, landed: false, slot: part.msgs.length };
  msg.n = (part.total = (part.total || 0) + 1) - 1;
  part.msgs.push(msg);
  const box = makeBox(k, msg.n);
  const loc = locOf(p, part.leader);
  const pts = [new THREE.Vector3(-12.9, 0.82, 0), new THREE.Vector3(-8, 1.3, 0), new THREE.Vector3(-6.6, 0.82, LANE_Z[p] * 0.18),
    new THREE.Vector3(-3.2, 0.82, LANE_Z[p]), new THREE.Vector3(slotX(msg.slot), loc.rep ? 0.72 : 0.82, loc.z)];
  if (loc.rep) pts.splice(4, 0, new THREE.Vector3(-3.2, 1.6, loc.z));
  flying.push({ box, pts, t: 0, seg: 0, msg, p });
  routerPulse = 1;
}
let routerPulse = 0;
function updateFlying(dt) {
  for (let i = flying.length - 1; i >= 0; i--) {
    const f = flying[i];
    const a = f.pts[f.seg], b = f.pts[f.seg + 1];
    if (f.seg === f.pts.length - 2) {   // место в журнале могло сдвинуться, пока коробка летела
      const loc = locOf(f.p, partitions[f.p].leader);
      b.set(slotX(f.msg.slot), loc.rep ? 0.72 : 0.82, loc.z);
    }
    const len = a.distanceTo(b);
    f.t += (dt * 7) / Math.max(len, 0.01);
    const t = Math.min(1, f.t);
    f.box.position.lerpVectors(a, b, t);
    if (f.seg === 1 || f.seg === 0) f.box.position.y += Math.sin(t * Math.PI) * 0.4;
    f.box.rotation.y += dt * (f.seg < 2 ? 4 : 0);
    if (t >= 1) {
      f.seg++; f.t = 0;
      if (f.seg >= f.pts.length - 1) {
        f.box.rotation.y = 0;
        f.msg.landed = true;
        f.msg.box = f.box;
        f.msg.loc = partitions[f.p].leader;
        layout();
        setTimeout(() => { replicate(f.p, f.msg); layout(); }, 450);
        flying.splice(i, 1);
      }
    }
  }
}
function replicate(p, msg) {
  if (msg.rep || state.brokerDown && p === 1) return;
  const other = partitions[p].leader === "home" ? "rep" : "home";
  if (other === "home" && state.brokerDown && p === 1) return;
  const loc = locOf(p, other);
  msg.rep = makeBox(msg.k, msg.n, true);
  msg.rep.position.set(slotX(msg.slot), loc.rep ? 0.72 : 0.82, loc.z);
  msg.rep.scale.setScalar(loc.rep ? 0.82 : 1);
  msg.rep.visible = state.showReplicas;
}
function layout() {   // все коробки — на своих местах (после сдвигов и смены лидера)
  for (const part of partitions) {
    for (const m of part.msgs) {
      if (!m.landed) continue;
      const lead = locOf(part.p, part.leader), other = locOf(part.p, part.leader === "home" ? "rep" : "home");
      const mainBox = m.loc === part.leader ? m.box : m.rep, repBox = m.loc === part.leader ? m.rep : m.box;
      if (mainBox) { mainBox.position.set(slotX(m.slot), lead.rep ? 0.72 : 0.82, lead.z); mainBox.scale.setScalar(lead.rep ? 0.82 : 1); }
      if (repBox) { repBox.position.set(slotX(m.slot), other.rep ? 0.72 : 0.82, other.z); repBox.scale.setScalar(other.rep ? 0.82 : 1); }
    }
  }
}

// ===================== чтение =====================
let readTimer = 0;
function readTick() {
  for (const g of Object.values(groups)) {
    if (!g.active || g.paused) continue;
    for (const r of g.robots) {
      if (!r.parts.length) continue;
      // берём партицию, где больше всего непрочитанного
      let best = null, most = 0;
      for (const p of r.parts) {
        const part = partitions[p];
        const unread = part.msgs.filter((m) => m.landed && m.n >= g.off[p]).length;
        if (unread > most) { most = unread; best = p; }
      }
      if (best === null) { r.part = r.part ?? r.parts[0]; continue; }
      r.part = best;
      const part = partitions[best];
      const msg = part.msgs.find((m) => m.landed && m.n >= g.off[best]);
      if (!msg) continue;
      const box = msg.loc === part.leader ? msg.box : msg.rep;
      if (!box) continue;
      g.off[best] = msg.n + 1;
      r.beamTarget = box; r.beamT = 0.45;
      if (g.name === "billing") setTimeout(() => { dimBox(box, true); msg.read = true; }, 250);
    }
  }
}
function robotTargets(dt) {
  for (const g of Object.values(groups)) {
    g.robots.forEach((r, i) => {
      let target;
      if (!g.active) target = new THREE.Vector3(19, -3, 0);
      else if (!r.parts.length) target = new THREE.Vector3(17.5, 0.1, 9.5 + i * 0.4);
      else {
        const p = r.part ?? r.parts[0];
        const part = partitions[p];
        const loc = locOf(p, part.leader);
        const first = part.msgs.find((m) => m.n >= g.off[p]);
        const slot = first ? first.slot : part.msgs.length;
        const zOff = loc.rep ? -1.2 : (g.side > 0 ? 1.45 : -2.85);
        target = new THREE.Vector3(slotX(slot) - 0.4, 0.1, loc.z + zOff);
      }
      r.lab.visible = g.active;
      r.g.position.lerp(target, Math.min(1, dt * 3));
      r.g.rotation.y = THREE.MathUtils.lerp(r.g.rotation.y, (g.side > 0 && !(r.parts.length && locOf(r.part ?? r.parts[0], partitions[r.part ?? r.parts[0]].leader).rep)) ? Math.PI : 0, Math.min(1, dt * 4));
      r.g.position.y = 0.1 + Math.abs(Math.sin(performance.now() / 260 + i)) * 0.06;
      // луч сканера
      if (r.beamT > 0 && r.beamTarget) {
        r.beamT -= dt;
        const a = r.g.position.clone().add(new THREE.Vector3(0, 1.45, 0)), b = r.beamTarget.position.clone();
        const mid = a.clone().add(b).multiplyScalar(0.5);
        r.beam.visible = true;
        r.beam.position.copy(mid);
        r.beam.scale.set(1, a.distanceTo(b), 1);
        r.beam.lookAt(b); r.beam.rotateX(Math.PI / 2);
      } else r.beam.visible = false;
    });
  }
}

// ===================== шаги истории =====================
const state = { flow: 1.6, showReplicas: false, brokerDown: false };
const HUD = document.getElementById("hud");
const STEPS = [
  { act: "Пролог", title: "Как сервисы передают друг другу сообщения", cam: [[-6, 26, 34], [2, 0, 0]],
    text: "Сервис заказов хочет сообщить остальным: «заказ 501 оплачен». Звонить каждому — долго и ненадёжно. Поэтому он кладёт сообщение в <b>Kafka</b> — что-то вроде склада с конвейерами, — а другие сервисы забирают его оттуда, когда им удобно.",
    enter() { state.flow = 1.8; } },
  { act: "Акт I · Продюсер", title: "Продюсер отправляет сообщения", cam: [[-27, 9, 12], [-14, 2, 0]],
    text: "<b>Продюсер</b> (producer) — тот, кто пишет в Kafka. Здесь это фабрика: сервис заказов. Каждое событие — коробка-<b>сообщение</b>.",
    enter() { state.flow = 1.2; } },
  { act: "Акт I · Продюсер", title: "Что внутри сообщения", cam: [[-13, 4, 6.5], [-10.5, 0.8, 0]],
    text: "У сообщения есть <b>ключ</b> (key) и <b>значение</b> (value). Ключ — например, <code>user-2</code>: от него зависит, куда поедет коробка. Цвет коробки = ключ. Значение — сами данные: <code>{\"order\": 501, \"status\": \"paid\"}</code>.",
    enter() { state.flow = 1.4; } },
  { act: "Акт II · Топик", title: "Распределитель: hash(ключ) % 3", cam: [[-10, 10, 11], [-5.5, 0.5, 0]], interactive: true,
    text: "Kafka считает от ключа число и берёт остаток от деления на число партиций. <b>Одинаковый ключ всегда едет на одну и ту же ленту</b> — поэтому сообщения одного пользователя не перепутаются по порядку. Отправь сам:",
    acts: () => KEYS.map((k, i) => ({ label: k, cls: "k", color: KCOL[i], run: () => send(i) })),
    enter() { state.flow = 0; } },
  { act: "Акт II · Топик", title: "Топик и партиции", cam: [[-5, 15, 18], [2, 0, 0]],
    text: "Все ленты вместе — <b>топик</b> <code>orders</code>. Каждая лента — <b>партиция</b> (partition): журнал, куда сообщения только <b>дописываются в конец</b>. Номер на коробке — <b>офсет</b> (offset): порядковый номер в партиции. 3 партиции = 3 ленты работают параллельно.",
    enter() { state.flow = 1.0; } },
  { act: "Акт II · Топик", title: "Брокеры и реплики", cam: [[-9, 12, 16], [4, 0, -1]],
    text: "Каждый ангар — <b>брокер</b> (broker), отдельный сервер Kafka. Лента партиции стоит у брокера-<b>лидера</b>. А на соседнем брокере на полке лежит <b>реплика</b> — полупрозрачная копия тех же коробок. Если брокер сломается, данные не пропадут.",
    enter() { state.showReplicas = true; state.flow = 1.2; } },
  { act: "Акт III · Консьюмеры", title: "Консьюмер читает по порядку", cam: [[5, 6, 12], [0, 0.8, 2]],
    text: "<b>Консьюмер</b> (consumer) — тот, кто читает. Робот идёт вдоль ленты и сканирует коробки по порядку. Прочитанные темнеют, но <b>не исчезают</b>: Kafka хранит сообщения, пока не истечёт срок хранения. Робот лишь запоминает, докуда дочитал, — это его офсет.",
    enter() { state.flow = 1.0; } },
  { act: "Акт III · Консьюмеры", title: "Группа консьюмеров и ребаланс", cam: [[-3, 15, 19], [3, 0, 0]], interactive: true,
    text: "Роботы одного сервиса — <b>группа</b> (consumer group) <code>billing</code>. Каждую партицию в группе читает ровно один робот. Добавь робота — Kafka перераздаст ленты (<b>ребаланс</b>). Четвёртый робот при трёх партициях будет простаивать.",
    acts: () => [{ label: "+ консьюмер", primary: true, run: () => { if (groups.billing.robots.length < 4) { makeRobot(groups.billing, groups.billing.robots.length); assign(groups.billing); } } },
                 { label: "− консьюмер", run: () => { const r = groups.billing.robots.pop(); if (r && groups.billing.robots.length) { scene.remove(r.g); scene.remove(r.beam); r.lab.element.remove(); assign(groups.billing); } else if (r) groups.billing.robots.push(r); } }],
    enter() { state.flow = 1.4; } },
  { act: "Акт III · Консьюмеры", title: "Вторая группа читает то же самое", cam: [[-3, 12, -20], [2, 0, 0]],
    text: "Другому сервису — <b>аналитике</b> — нужны те же заказы. Его группа <code>analytics</code> (фиолетовые роботы) читает тот же топик <b>с самого начала</b> и со <b>своими</b> офсетами. Группы друг другу не мешают.",
    enter() { groups.analytics.active = true; state.flow = 1.2; } },
  { act: "Акт IV · Когда что-то идёт не так", title: "Lag — отставание", cam: [[-5, 14, 18], [3, 0, 0]],
    text: "Роботы <code>billing</code> встали (сервис тормозит), а заказы всё идут. Непрочитанные коробки копятся — это <b>lag</b>: сколько сообщений группа ещё не прочитала. Первое, что смотрит тестировщик, когда «сообщения не доходят».",
    enter() { groups.billing.paused = true; state.flow = 0.45; }, leave() { groups.billing.paused = false; } },
  { act: "Акт IV · Когда что-то идёт не так", title: "Брокер упал — данные целы", cam: [[-7, 12, 18], [3, 0, 2]],
    text: "Брокер 2 отключился, его лента погасла. Но реплика партиции <b>P1</b> лежит на брокере 3 — она становится новым <b>лидером</b>, и запись с чтением продолжаются уже через неё. Ничего не потерялось.",
    enter() { failBroker(true); state.flow = 1.0; }, leave() { failBroker(false); } },
  { act: "Эпилог", title: "Что проверяет тестировщик", cam: [[-8, 22, 30], [3, 0, 0]],
    text: "Сообщение дошло и в нужном формате · сообщения с одним ключом пришли по порядку · нет дублей и потерь, если консьюмер упал · lag не растёт · «битые» сообщения уходят в отдельную очередь (DLQ). Это — следующие уроки темы.",
    enter() { state.flow = 1.4; } },
];
const DURATION = 9;

function failBroker(on) {
  if (state.brokerDown === on) return;
  state.brokerDown = on;
  const b = brokers[1];
  b.light.intensity = on ? 0 : 14;
  b.floor.material.color.set(on ? 0x6b3a46 : 0x7a6a86);
  b.label.element.textContent = on ? "Брокер 2 · недоступен" : "Брокер 2";
  b.label.element.className = "label big" + (on ? " red" : "");
  const p1 = partitions[1];
  p1.leader = on ? "rep" : "home";
  p1.homeLabel.element.textContent = on ? "P1 · был лидер" : "P1 · лидер";
  p1.homeLabel.element.className = "label " + (on ? "red" : "mint");
  p1.repLabel.element.textContent = on ? "P1 · новый лидер" : "реплика P1";
  p1.repLabel.element.className = "label " + (on ? "mint" : "");
  for (const m of p1.msgs) {
    if (!m.landed) continue;
    if (on && !m.rep) replicate(1, m);
    const lead = m.loc === "home" ? m.box : m.rep, rep = m.loc === "home" ? m.rep : m.box;
    if (lead) { lead.material.forEach((mt) => { mt.transparent = on; mt.opacity = on ? 0.25 : 1; }); }
    if (rep) { rep.visible = true; rep.material.forEach((mt) => { mt.transparent = !on; mt.opacity = on ? 1 : 0.3; }); }
  }
  layout();
}

// ---------- проигрывание ----------
let step = 0, stepT = 0, playing = true, free = false;
const camFrom = { pos: new THREE.Vector3(), tgt: new THREE.Vector3() }, camTo = { pos: new THREE.Vector3(), tgt: new THREE.Vector3() };
let camT = 1;
const curTarget = new THREE.Vector3();
const dotsEl = document.getElementById("dots");
dotsEl.innerHTML = STEPS.map((_, i) => `<div class="dot" data-i="${i}"><i></i></div>`).join("");
dotsEl.querySelectorAll(".dot").forEach((d) => (d.onclick = () => go(Number(d.dataset.i))));

function go(i) {
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  STEPS[step].leave?.();
  // состояние, которое копится по ходу истории, выставляем явно — так можно прыгать по шагам
  state.showReplicas = i >= 5;
  groups.analytics.active = i >= 8;
  step = i; stepT = 0;
  const S = STEPS[i];
  S.enter?.();
  for (const part of partitions) for (const m of part.msgs) if (m.rep) m.rep.visible = state.showReplicas || state.brokerDown && part.p === 1;
  partitions.forEach((p) => (p.repLabel.visible = state.showReplicas));
  partitions.forEach((p) => p.shelf.visible = state.showReplicas);
  document.getElementById("num").textContent = `${String(i).padStart(2, "0")} / ${STEPS.length - 1}`;
  document.getElementById("actname").textContent = S.act;
  document.getElementById("title").textContent = S.title;
  document.getElementById("text").innerHTML = S.text;
  const acts = document.getElementById("acts");
  acts.innerHTML = "";
  (S.acts?.() || []).forEach((a) => {
    const b = document.createElement("button");
    b.className = "act" + (a.cls ? " " + a.cls : "") + (a.primary ? " primary" : "");
    b.textContent = a.label;
    if (a.color) b.style.borderColor = "#" + a.color.toString(16).padStart(6, "0");
    b.onclick = a.run;
    acts.appendChild(b);
  });
  camFrom.pos.copy(camera.position); camFrom.tgt.copy(curTarget);
  camTo.pos.set(...S.cam[0]); camTo.tgt.set(...S.cam[1]);
  const portrait = innerHeight > innerWidth;
  if (portrait) camTo.pos.sub(camTo.tgt).multiplyScalar(1.7).add(camTo.tgt);   // на вертикальном экране — дальше, чтобы всё влезло
  camT = 0;
  if (S.interactive) setPlaying(false);
  dotsEl.querySelectorAll(".dot").forEach((d, k) => d.classList.toggle("done", k < i));
}
function setPlaying(v) { playing = v; document.getElementById("play").textContent = v ? "❚❚" : "▶"; }
document.getElementById("play").onclick = () => setPlaying(!playing);
document.getElementById("next").onclick = () => go(step + 1);
document.getElementById("prev").onclick = () => go(step - 1);
document.getElementById("labels").onclick = (e) => { document.body.classList.toggle("nolabels"); e.currentTarget.classList.toggle("on", !document.body.classList.contains("nolabels")); };
document.getElementById("labels").classList.add("on");
document.getElementById("free").onclick = (e) => {
  free = !free; controls.enabled = free; e.currentTarget.classList.toggle("on", free);
  if (free) { controls.target.copy(curTarget); setPlaying(false); }
};
addEventListener("keydown", (e) => { if (e.key === "ArrowRight") go(step + 1); if (e.key === "ArrowLeft") go(step - 1); if (e.key === " ") setPlaying(!playing); });

// ---------- старт ----------
makeRobot(groups.billing, 0);
makeRobot(groups.analytics, 0);
makeRobot(groups.analytics, 1);
assign(groups.billing); assign(groups.analytics);
for (let i = 0; i < 7; i++) send([0, 1, 2, 3, 1, 0, 2][i]);
camera.position.set(-30, 40, 50); curTarget.set(0, 0, 0);
go(0);

const clock = new THREE.Clock();
let sendT = 0;
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  const now = performance.now() / 1000;
  // камера
  if (!free) {
    if (camT < 1) {
      camT = Math.min(1, camT + dt / 2.4);
      const e = camT < 0.5 ? 4 * camT ** 3 : 1 - (-2 * camT + 2) ** 3 / 2;
      camera.position.lerpVectors(camFrom.pos, camTo.pos, e);
      curTarget.lerpVectors(camFrom.tgt, camTo.tgt, e);
    } else {
      // лёгкое «дыхание» камеры
      camera.position.copy(camTo.pos).add(new THREE.Vector3(Math.sin(now * 0.25) * 0.6, Math.sin(now * 0.33) * 0.25, 0));
    }
    camera.lookAt(curTarget);
  } else controls.update();
  // поток сообщений
  if (state.flow > 0) { sendT += dt; if (sendT > state.flow) { sendT = 0; send(Math.floor(Math.random() * 4)); } }
  updateFlying(dt);
  readTimer += dt;
  if (readTimer > 0.9) { readTimer = 0; readTick(); }
  robotTargets(dt);
  router.userData.disc.rotation.y += dt * (1 + routerPulse * 6);
  routerPulse = Math.max(0, routerPulse - dt * 2);
  smoke.forEach((s) => { s.userData.t = (s.userData.t + dt * 0.12) % 1; const t = s.userData.t; s.position.set(-18 + t * 3, 6.5 + t * 5, -2.2 - t * 1.5); s.scale.setScalar(0.4 + t * 1.6); s.material.opacity = 0.5 * (1 - t); });
  // HUD: lag
  const lag = (g) => partitions.reduce((s, part, p) => s + part.msgs.filter((m) => m.landed && m.n >= g.off[p]).length, 0);
  if (step >= 7) {
    const lb = lag(groups.billing), la = lag(groups.analytics);
    HUD.innerHTML = `<div class="${lb > 8 ? "hi" : ""}">billing · lag ${lb}</div>` + (groups.analytics.active ? `<div>analytics · lag ${la}</div>` : "");
  } else HUD.innerHTML = "";
  // автопроигрывание
  if (playing) {
    stepT += dt;
    const d = dotsEl.children[step]?.querySelector("i");
    if (d) d.style.width = `${Math.min(100, (stepT / DURATION) * 100)}%`;
    if (stepT > DURATION && step < STEPS.length - 1) go(step + 1);
  }
  composer.render();
  labelR.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(() => { const l = document.getElementById("loading"); l.style.opacity = 0; setTimeout(() => l.remove(), 700); }, 400);
// сцену рисуем чуть ниже центра: сверху её закрывает карточка с текстом
function viewOffset() { const k = innerHeight > innerWidth ? 0.17 : 0.07; camera.setViewOffset(innerWidth, innerHeight, 0, -k * innerHeight, innerWidth, innerHeight); }
viewOffset();
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; viewOffset(); camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); labelR.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>

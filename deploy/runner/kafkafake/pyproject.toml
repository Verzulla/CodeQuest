[project]
name = "kafkafake"
version = "0.1.0"
description = "Учебная Kafka в памяти с API confluent-kafka (песочница CodeQuest)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kafkafake"]

[project.entry-points.pytest11]
kafkafake = "kafkafake.pytest_plugin"
